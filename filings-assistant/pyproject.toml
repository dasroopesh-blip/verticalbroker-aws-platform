[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filings-assistant"
version = "0.1.0"
description = "Agentic RAG assistant over public SEC EDGAR filings (MCP + hybrid search + Bedrock)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dasroopesh-blip" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies. Kept intentionally lean; heavier/optional pieces
# (MCP server, agent) live under optional-dependencies so the core ingest +
# search path can run without pulling everything in.
dependencies = [
    "boto3>=1.34.0",
    "aws-lambda-powertools[all]>=2.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "opensearch-py>=2.4.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "moto[all]>=5.0.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "boto3-stubs[essential]>=1.34.0",
    "bandit>=1.7.7",
    "pre-commit>=3.6.0",
]

[project.scripts]
# Convenience CLIs (thin wrappers around the modules).
fa-ingest = "filings_assistant.ingestion.cli:main"
fa-ask = "filings_assistant.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["filings_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "-ra",
    "--tb=short",
    "--cov=filings_assistant",
    "--cov-report=term-missing",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require LocalStack/OpenSearch)",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "build/"]
