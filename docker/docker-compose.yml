# =============================================================================
# VerticalBroker Local Development Stack
# Provides LocalStack (AWS services) + PostgreSQL (Aurora substitute)
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down -v
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # LocalStack - Emulates AWS services locally
  # ===========================================================================
  localstack:
    image: localstack/localstack:3.0
    container_name: vb-localstack
    ports:
      - "4566:4566"         # All AWS services
      - "4510-4559:4510-4559"  # Service-specific ports
    environment:
      - SERVICES=s3,dynamodb,sqs,kinesis,events,lambda,glue,sts,cloudwatch,logs
      - DEBUG=0
      - PERSISTENCE=1
      - LAMBDA_EXECUTOR=docker-reuse
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=testing
      - AWS_SECRET_ACCESS_KEY=testing
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-localstack.sh:/etc/localstack/init/ready.d/init.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PostgreSQL - Simulates Aurora PostgreSQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vb-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=verticalbroker
      - POSTGRES_USER=vb_admin
      - POSTGRES_PASSWORD=local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb_admin -d verticalbroker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PySpark/Glue Development Container
  # ===========================================================================
  glue-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.glue
    container_name: vb-glue-dev
    volumes:
      - "../src:/workspace/src"
      - "../tests:/workspace/tests"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=testing
      - AWS_SECRET_ACCESS_KEY=testing
      - BRONZE_BUCKET=vb-bronze-local
      - SILVER_BUCKET=vb-silver-local
      - GOLD_BUCKET=vb-gold-local
    depends_on:
      localstack:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  default:
    name: verticalbroker-net
